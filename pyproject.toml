[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "download-amazon-data"
version = "0.50.0"
description = "Amazon SP-API リアルタイム売上モニタリング"
requires-python = ">=3.12"

dependencies = [
    "requests>=2.31.0",
    "gspread>=6.1.2",
    "oauth2client>=4.1.3",
    "python-dotenv>=1.0.1",
    "sales-data",
]

# 売上/日 の行構成と読み書きは automation 直下の共有ライブラリが持つ。
# editable なので、ライブラリを直せば再インストールなしで反映される
[tool.uv.sources]
sales-data = { path = "../../shared/sales-data", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["py_tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
# 共有ライブラリのパスを明示する。editable install の .pth は macOS の hidden
# フラグが立つと Python 3.13+ の site に無視され、chflags で外しても数分で戻る
pythonpath = [".", "../../shared/sales-data/src"]
